name: macOS adapter checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Shared control and observation regressions
        run: node --test tests/platform-contract.test.mjs tests/lifecycle.test.mjs tests/workflow.test.mjs tests/observed-selectors.test.mjs tests/launch-observe.test.mjs tests/recovery-update.test.mjs tests/update-transaction.test.mjs tests/atomic-json.test.mjs tests/transport-failure.test.mjs
      - name: Compile native adapters and check contracts without desktop access
        run: node scripts/macos-native-check.mjs
      - name: Native private storage and controller-ownership checks
        run: node --test tests/macos-storage.test.mjs tests/desktop-service.test.mjs
      - name: Package the prebuilt Mac candidate
        run: node scripts/bundle.mjs --output .localdata/macos-bundle
      - name: Install, restart, update and rollback in a project-local fake home
        run: node scripts/macos-install-check.mjs
      - name: Archive experimental prebuilt candidate
        run: tar -czf .localdata/AntigravityComputerUse-macos-candidate.tar.gz -C .localdata macos-bundle
      - uses: actions/upload-artifact@v6
        with:
          name: AntigravityComputerUse-${{ matrix.runner }}-candidate
          path: .localdata/AntigravityComputerUse-macos-candidate.tar.gz
          retention-days: 14
      - name: Verify source provenance
        run: node scripts/check-provenance.mjs
