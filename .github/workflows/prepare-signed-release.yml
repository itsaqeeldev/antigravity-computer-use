name: Prepare signed release assets (no publication)
on:
  push:
    branches: [codex/macos-and-latency-review]
    paths:
      - .github/workflows/prepare-signed-release.yml
      - scripts/sign-update.mjs
      - scripts/sign-update-ci.mjs
      - scripts/verify-signed-assets.mjs
      - release-public-key.pem
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonically increasing release sequence
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win32
            arch: x64
            minimum_kernel: 10.0.19041
          - runner: macos-15
            platform: darwin
            arch: arm64
            minimum_kernel: 23.0.0
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            minimum_kernel: 23.0.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Check provenance
        run: node scripts/check-provenance.mjs
      - name: Verify release asset validation regressions
        run: node --test tests/signed-assets.test.mjs
      - name: Build sealed bundle
        run: node scripts/bundle.mjs --output .localdata/release-bundle
      - name: Sign published-update metadata and prepare payload assets
        env:
          AGCU_RELEASE_SIGNING_KEY: ${{ secrets.AGCU_RELEASE_SIGNING_KEY }}
          RELEASE_SEQUENCE: ${{ inputs.sequence || github.run_id }}
          MINIMUM_KERNEL: ${{ matrix.minimum_kernel }}
        shell: bash
        run: node scripts/sign-update-ci.mjs .localdata/release-bundle "$RELEASE_SEQUENCE" "$MINIMUM_KERNEL" .localdata/signed-release
      - name: Independently verify public signature and prepared payloads
        run: node scripts/verify-signed-assets.mjs .localdata/release-bundle .localdata/signed-release
      - name: Qualify the exact signed Mac bundle with native services
        if: runner.os == 'macOS'
        run: node scripts/macos-install-check.mjs .localdata/release-bundle
      - name: Qualify the exact signed Windows bundle or record ACL refusal
        if: runner.os == 'Windows'
        run: node scripts/windows-install-check.mjs .localdata/release-bundle
      - uses: actions/upload-artifact@v6
        with:
          name: signed-release-${{ matrix.platform }}-${{ matrix.arch }}
          path: .localdata/signed-release/
          retention-days: 7
      # Publication and installer pins require the separately recorded native,
      # real-app, physical-input and release-transport acceptance gates.
